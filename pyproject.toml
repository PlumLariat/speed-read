[project]
name = "speed-read"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "filetype>=1.2.0",
    "google-genai>=2.8.0",
    "pdf2image>=1.17.0",
    "pillow>=12.2.0",
    "pyside6>=6.11.1",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.16",
    "ty>=0.0.47",
]
docs = [
    "mkdocstrings-python>=2.0.4",
    "zensical>=0.0.45",
]

[tool.pytest.ini_options]
pythonpath = ["."]
