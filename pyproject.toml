[project]
name = "speed-read"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "filetype>=1.2.0",
    "google-genai>=2.8.0",
    "pdf2image>=1.17.0",
    "pillow>=12.2.0",
    "pyside6>=6.11.1",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.2",
]

[project.scripts]
speed-read = "speed_read.__main__:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.16",
    "ty>=0.0.46",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
]
